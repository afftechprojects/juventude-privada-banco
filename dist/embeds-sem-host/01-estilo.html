<style>
/* Banco de Atividades e Ferramentas Educacionais — Juventude Privada
   Tudo escopado em #jp-banco para não vazar para o Webflow nem sofrer com o CSS dele.
   Paleta e tipografia lidas do site: Rubik, #273975, #F09900, #25BCCA. */

#jp-banco {
  --jp-navy:      #273975;
  --jp-navy-esc:  #1b2851;
  --jp-navy-luz:  #eef1f9;
  --jp-ambar:     #f09900;
  --jp-ambar-luz: #fff5e3;
  --jp-ciano:     #25bcca;
  --jp-ciano-luz: #e6f8fa;
  --jp-texto:     #333333;
  --jp-suave:     #6b7280;
  --jp-linha:     #e3e6ef;
  --jp-fundo:     #ffffff;
  --jp-cinza:     #f7f8fb;
  --jp-r:         10px;
  --jp-sombra:    0 1px 2px rgba(39,57,117,.06), 0 8px 24px rgba(39,57,117,.07);

  font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--jp-texto);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* reset local, defensivo contra o CSS do Webflow */
#jp-banco *, #jp-banco *::before, #jp-banco *::after { box-sizing: border-box; }
#jp-banco h1, #jp-banco h2, #jp-banco h3, #jp-banco h4, #jp-banco p,
#jp-banco ul, #jp-banco ol, #jp-banco li, #jp-banco figure, #jp-banco dl,
#jp-banco dd { margin: 0; padding: 0; }
#jp-banco ul, #jp-banco ol { list-style: none; }
#jp-banco button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
#jp-banco a { color: var(--jp-navy); text-decoration: underline; text-underline-offset: 2px; }
#jp-banco img { max-width: 100%; height: auto; display: block; }

#jp-banco .jp-wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
#jp-banco .jp-oculto { display: none !important; }
#jp-banco .jp-sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ============================== tipografia ============================== */
#jp-banco h1, #jp-banco h2, #jp-banco h3, #jp-banco h4 {
  color: var(--jp-navy); font-weight: 500; line-height: 1.25;
}
#jp-banco h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.6rem); }
#jp-banco h2 { font-size: clamp(1.3rem, 1.05rem + 1.1vw, 1.8rem); }
#jp-banco h3 { font-size: 1.15rem; }
#jp-banco .jp-super {
  text-transform: uppercase; letter-spacing: .12em;
  font-size: .72rem; font-weight: 500; color: var(--jp-ambar);
}
#jp-banco .jp-lede { font-size: 1.06rem; color: var(--jp-suave); max-width: 62ch; }

/* ============================== hero =================================== */
#jp-banco .jp-hero { padding: 8px 0 4px; max-width: 46rem; }
#jp-banco .jp-hero h1 { margin: 8px 0 14px; letter-spacing: -.01em; }
#jp-banco .jp-hero-sub { font-size: clamp(1.05rem, .98rem + .5vw, 1.28rem); color: var(--jp-texto); line-height: 1.5; }
#jp-banco .jp-hero-frase {
  margin-top: 20px; padding-left: 16px; border-left: 3px solid var(--jp-ambar);
  font-size: 1.05rem; color: var(--jp-navy);
}

#jp-banco .jp-secao { margin: 48px 0 8px; }
#jp-banco .jp-secao > h2 { margin-bottom: 6px; }
#jp-banco .jp-secao > .jp-lede { margin-bottom: 20px; }

/* ============================== portas ================================= */
#jp-banco .jp-portas {
  display: grid; gap: 16px; margin: 36px 0 8px;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}
#jp-banco .jp-porta {
  text-align: left; border: 1px solid var(--jp-linha); border-radius: var(--jp-r);
  background: var(--jp-fundo); padding: 24px 22px; display: flex; flex-direction: column; gap: 6px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
#jp-banco .jp-porta:hover { border-color: var(--jp-navy); box-shadow: var(--jp-sombra); transform: translateY(-2px); }
#jp-banco .jp-porta[aria-pressed="true"] { border-color: var(--jp-navy); background: var(--jp-navy-luz); box-shadow: var(--jp-sombra); }
#jp-banco .jp-porta-ic { font-size: 1.6rem; line-height: 1; margin-bottom: 8px; }
#jp-banco .jp-porta-t { font-size: 1.14rem; font-weight: 500; color: var(--jp-navy); line-height: 1.3; }
#jp-banco .jp-porta-d { font-size: .9rem; color: var(--jp-suave); flex: 1; }
#jp-banco .jp-porta-n {
  font-size: .72rem; color: var(--jp-ambar); font-weight: 500; margin-top: 10px;
  text-transform: uppercase; letter-spacing: .07em;
}

/* ============================== coleções =============================== */
#jp-banco .jp-cols {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
}
#jp-banco .jp-col {
  text-align: left; border: 1px solid var(--jp-linha); border-radius: var(--jp-r);
  padding: 18px; display: flex; flex-direction: column; gap: 5px; background: var(--jp-fundo);
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
#jp-banco .jp-col:hover { border-color: var(--jp-navy); box-shadow: var(--jp-sombra); transform: translateY(-2px); }
#jp-banco .jp-col[aria-pressed="true"] { border-color: var(--jp-ambar); background: var(--jp-ambar-luz); }
#jp-banco .jp-col-ic { font-size: 1.35rem; line-height: 1; margin-bottom: 4px; }
#jp-banco .jp-col-t { font-weight: 500; color: var(--jp-navy); font-size: 1.02rem; }
#jp-banco .jp-col-r { font-size: .86rem; color: var(--jp-suave); flex: 1; }
#jp-banco .jp-col-n {
  font-size: .72rem; font-weight: 500; color: var(--jp-ambar); margin-top: 8px;
  text-transform: uppercase; letter-spacing: .07em;
}
#jp-banco .jp-col[aria-pressed="true"] .jp-col-n { color: #8a5800; }

/* ============================== cenário ================================ */
#jp-banco .jp-cenario {
  background: var(--jp-navy); color: #fff; border-radius: var(--jp-r);
  padding: 26px 24px; margin: 26px 0;
}
#jp-banco .jp-cenario h2 { color: #fff; margin-bottom: 4px; }
#jp-banco .jp-cenario-sub { color: rgba(255,255,255,.72); font-size: .92rem; margin-bottom: 16px; }
/* linhas da busca: ícone, rótulo, controle. Lê como conversa. */
#jp-banco .jp-busca { display: grid; gap: 2px; }
#jp-banco .jp-busca-lin {
  display: grid; grid-template-columns: 30px 190px 1fr; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; transition: background .12s;
}
#jp-banco .jp-busca-lin:hover { background: rgba(255,255,255,.06); }
#jp-banco .jp-busca-ic { font-size: 1.1rem; line-height: 1; }
#jp-banco .jp-busca-rot { color: rgba(255,255,255,.72); font-size: .95rem; }
#jp-banco .jp-slot { display: block; position: relative; max-width: 330px; }
#jp-banco .jp-slot select {
  appearance: none; -webkit-appearance: none;
  font: inherit; font-weight: 500; font-size: 1.02rem;
  color: #fff; background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2); border-radius: 7px; cursor: pointer;
  padding: 8px 34px 8px 13px; line-height: 1.4;
  width: 100%; max-width: 330px;
  transition: background .12s, border-color .12s;
}
#jp-banco .jp-slot select:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
#jp-banco .jp-slot select option { color: var(--jp-texto); background: #fff; }
#jp-banco .jp-slot select:focus-visible { outline: 3px solid var(--jp-ciano); outline-offset: 2px; }
#jp-banco .jp-slot::after {
  content: ""; position: absolute; right: 14px; top: 50%; pointer-events: none;
  width: 7px; height: 7px; border-right: 2px solid rgba(255,255,255,.7); border-bottom: 2px solid rgba(255,255,255,.7);
  transform: translateY(-70%) rotate(45deg);
}
#jp-banco .jp-cenario-acoes { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }

/* ============================== botões ================================= */
#jp-banco .jp-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 6px; font-weight: 500; font-size: .95rem;
  text-decoration: none; border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s;
}
#jp-banco .jp-btn-p { background: var(--jp-ambar); color: var(--jp-navy); }
#jp-banco .jp-btn-p:hover { background: #d98a00; }
#jp-banco .jp-btn-s { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
#jp-banco .jp-btn-s:hover { border-color: #fff; background: rgba(255,255,255,.08); }
#jp-banco .jp-btn-o { background: transparent; color: var(--jp-navy); border-color: var(--jp-linha); }
#jp-banco .jp-btn-o:hover { border-color: var(--jp-navy); background: var(--jp-navy-luz); }
#jp-banco .jp-btn:focus-visible { outline: 3px solid var(--jp-ciano); outline-offset: 2px; }

/* ============================== busca por texto ======================== */
#jp-banco .jp-busca-texto { position: relative; margin: 40px 0 14px; }
#jp-banco .jp-lupa { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: .95rem; pointer-events: none; }
#jp-banco .jp-input {
  width: 100%; font: inherit; font-size: 1rem; color: var(--jp-texto);
  padding: 14px 44px 14px 44px; border: 1px solid var(--jp-linha);
  border-radius: 8px; background: var(--jp-fundo); appearance: none; -webkit-appearance: none;
  transition: border-color .15s, box-shadow .15s;
}
#jp-banco .jp-input::-webkit-search-decoration,
#jp-banco .jp-input::-webkit-search-cancel-button { -webkit-appearance: none; }
#jp-banco .jp-input:focus { outline: 0; border-color: var(--jp-navy); box-shadow: 0 0 0 3px rgba(39,57,117,.1); }
#jp-banco .jp-input::placeholder { color: #9aa1b2; }
#jp-banco .jp-input-x {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%; font-size: 1.1rem; color: var(--jp-suave);
  display: grid; place-items: center;
}
#jp-banco .jp-input-x:hover { background: var(--jp-cinza); color: var(--jp-navy); }

/* ============================== filtros ativos ========================= */
#jp-banco .jp-ativos {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 14px 16px; margin-bottom: 18px;
  background: var(--jp-navy-luz); border-radius: 8px;
}
#jp-banco .jp-ativos-t {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--jp-suave); font-weight: 500; margin-right: 2px;
}
#jp-banco .jp-ativo {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--jp-navy); color: #fff; border-radius: 999px;
  padding: 5px 12px; font-size: .84rem;
}
#jp-banco .jp-ativo span[aria-hidden] { font-size: 1rem; line-height: 1; opacity: .7; }
#jp-banco .jp-ativo:hover { background: var(--jp-navy-esc); }
#jp-banco .jp-ativo:hover span[aria-hidden] { opacity: 1; }

/* ============================== ordenar ================================ */
#jp-banco .jp-ordenar { display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--jp-suave); }
#jp-banco .jp-ordenar select {
  font: inherit; font-size: .84rem; color: var(--jp-navy); font-weight: 500;
  border: 1px solid var(--jp-linha); border-radius: 6px; background: var(--jp-fundo);
  padding: 5px 10px; cursor: pointer;
}
#jp-banco .jp-ordenar select:hover { border-color: var(--jp-navy); }

/* ============================== filtros ================================ */
#jp-banco .jp-filtros { border: 1px solid var(--jp-linha); border-radius: var(--jp-r); margin-bottom: 18px; }
#jp-banco .jp-filtros-dica { font-size: .85rem; color: var(--jp-suave); padding: 16px 0 2px; max-width: 68ch; }
#jp-banco .jp-filtros-cab {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 14px 18px; text-align: left;
}
#jp-banco .jp-filtros-cab span { font-weight: 500; color: var(--jp-navy); }
#jp-banco .jp-filtros-corpo { padding: 4px 18px 20px; border-top: 1px solid var(--jp-linha); }
#jp-banco .jp-grupo { padding: 16px 0 4px; border-bottom: 1px solid var(--jp-linha); }
#jp-banco .jp-grupo:last-child { border-bottom: 0; }
#jp-banco .jp-grupo-t {
  text-transform: uppercase; letter-spacing: .1em; font-size: .7rem;
  color: var(--jp-suave); font-weight: 500; margin-bottom: 10px;
}
#jp-banco .jp-grupo-t em {
  font-style: normal; text-transform: none; letter-spacing: 0;
  font-size: .78rem; color: #9aa1b2; margin-left: 8px;
}
#jp-banco .jp-chips { display: flex; flex-wrap: wrap; gap: 8px; }
#jp-banco .jp-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 8px 6px 14px; border-radius: 999px; border: 1px solid var(--jp-linha);
  font-size: .88rem; color: var(--jp-texto); background: var(--jp-fundo);
  transition: border-color .12s, background .12s, color .12s, opacity .12s;
}
#jp-banco .jp-chip:hover:not([disabled]) { border-color: var(--jp-navy); }
#jp-banco .jp-chip[aria-pressed="true"] { background: var(--jp-navy); border-color: var(--jp-navy); color: #fff; }
#jp-banco .jp-chip:focus-visible { outline: 3px solid var(--jp-ciano); outline-offset: 2px; }
#jp-banco .jp-chip-n {
  min-width: 22px; padding: 0 6px; border-radius: 999px; text-align: center;
  background: var(--jp-cinza); color: var(--jp-suave);
  font-size: .72rem; font-weight: 500; line-height: 1.7;
}
#jp-banco .jp-chip[aria-pressed="true"] .jp-chip-n { background: rgba(255,255,255,.22); color: #fff; }
/* opção que zeraria o resultado: some do caminho sem sumir da tela */
#jp-banco .jp-chip[data-zero] { opacity: .32; cursor: not-allowed; }
#jp-banco .jp-chip[data-zero] .jp-chip-n { background: transparent; }

/* ============================== resultados ============================= */
#jp-banco .jp-barra {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
  justify-content: space-between; margin-bottom: 16px;
}
#jp-banco .jp-conta { font-weight: 500; color: var(--jp-navy); }
#jp-banco .jp-conta em { font-style: normal; color: var(--jp-suave); font-weight: 400; }

#jp-banco .jp-grade {
  display: grid; gap: 18px; margin-bottom: 40px;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
}
#jp-banco .jp-card {
  border: 1px solid var(--jp-linha); border-radius: var(--jp-r); background: var(--jp-fundo);
  padding: 20px; text-align: left; display: flex; flex-direction: column; gap: 10px;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
#jp-banco .jp-card:hover { border-color: var(--jp-navy); box-shadow: var(--jp-sombra); transform: translateY(-2px); }
#jp-banco .jp-card:focus-visible { outline: 3px solid var(--jp-ciano); outline-offset: 2px; }
#jp-banco .jp-card-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--jp-suave); }
#jp-banco .jp-card-t { font-size: 1.18rem; font-weight: 500; color: var(--jp-navy); line-height: 1.3; }

/* o insight é o que vende a atividade, então ele domina o card */
#jp-banco .jp-card-insight {
  position: relative; flex: 1; padding: 14px 14px 14px 40px; margin-top: 4px;
  background: var(--jp-navy-luz); border-radius: 8px;
  font-size: .93rem; color: var(--jp-navy); line-height: 1.5;
}
#jp-banco .jp-card-lamp { position: absolute; left: 13px; top: 12px; font-size: 1rem; }
#jp-banco .jp-card:hover .jp-card-insight { background: var(--jp-ambar-luz); }
#jp-banco .jp-card-pe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
#jp-banco .jp-bncc-selo {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500;
  color: var(--jp-suave); white-space: nowrap;
}

#jp-banco .jp-selos { display: flex; flex-wrap: wrap; gap: 6px; }
#jp-banco .jp-selo {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 500;
  padding: 3px 9px; border-radius: 4px; white-space: nowrap;
}
#jp-banco .jp-selo-pronta-amanha { background: var(--jp-ambar-luz); color: #8a5800; }
#jp-banco .jp-selo-sem-tela     { background: var(--jp-ciano-luz); color: #0f6d77; }
#jp-banco .jp-selo-testada      { background: var(--jp-navy-luz);  color: var(--jp-navy); }
#jp-banco .jp-selo-sensivel     { background: #fdecec;             color: #a02020; }

#jp-banco .jp-vazio {
  border: 1px dashed var(--jp-linha); border-radius: var(--jp-r);
  padding: 44px 24px; text-align: center; color: var(--jp-suave); margin-bottom: 40px;
}
#jp-banco .jp-vazio strong { display: block; color: var(--jp-navy); font-size: 1.2rem; margin-bottom: 10px; font-weight: 500; }
#jp-banco .jp-vazio p { max-width: 52ch; margin: 0 auto 4px; }
#jp-banco .jp-vazio b { color: var(--jp-navy); font-weight: 500; }
#jp-banco .jp-vazio-acoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0 18px; }
#jp-banco .jp-vazio-nota { font-size: .85rem; padding-top: 14px; border-top: 1px solid var(--jp-linha); max-width: 56ch; }

/* ============================== progressão =============================
   Conta uma história de crescimento, do broto à balança, em vez de
   apresentar uma tabela curricular.                                       */
#jp-banco .jp-prog { margin-bottom: 48px; }
#jp-banco .jp-legenda { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
#jp-banco .jp-leg {
  display: inline-flex; align-items: baseline; gap: 6px;
  border: 1px solid var(--jp-linha); border-radius: 999px; padding: 5px 14px; font-size: .82rem;
}
#jp-banco .jp-leg em { font-style: normal; color: var(--jp-suave); font-size: .74rem; }

#jp-banco .jp-eixos { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
#jp-banco .jp-eixo { border: 1px solid var(--jp-linha); border-radius: var(--jp-r); padding: 22px 20px; }
#jp-banco .jp-eixo-nome { font-size: 1.1rem; margin-bottom: 4px; }
#jp-banco .jp-eixo-promessa { font-size: .86rem; color: var(--jp-suave); margin-bottom: 16px; }

#jp-banco .jp-passo { display: block; }
#jp-banco .jp-passo-b {
  display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; width: 100%; text-align: left;
  padding: 9px 12px; border-radius: 7px; border: 1px solid transparent; background: var(--jp-cinza);
  transition: background .12s, border-color .12s;
}
#jp-banco .jp-passo-b:hover:not([data-vazio]) { background: var(--jp-navy-luz); border-color: var(--jp-navy); }
#jp-banco .jp-passo-ic { grid-row: span 2; font-size: 1.15rem; line-height: 1.2; }
#jp-banco .jp-passo-txt { font-size: .9rem; color: var(--jp-texto); line-height: 1.35; }
#jp-banco .jp-passo-n { font-size: .7rem; color: var(--jp-ambar); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
#jp-banco .jp-passo-b[data-vazio] { opacity: .5; cursor: default; background: transparent; border: 1px dashed var(--jp-linha); }
#jp-banco .jp-passo-b[data-vazio] .jp-passo-n { color: var(--jp-suave); }
#jp-banco .jp-seta { display: block; text-align: center; color: var(--jp-ciano); font-size: .8rem; line-height: 1.6; }
#jp-banco .jp-prog-nota { font-size: .86rem; color: var(--jp-suave); margin-top: 22px; max-width: 70ch; }

/* ============================== o que você recebe ====================== */
#jp-banco .jp-recebe { border-top: 1px solid var(--jp-linha); padding-top: 40px; }
#jp-banco .jp-checks {
  display: grid; gap: 10px 26px; margin-bottom: 22px;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
}
#jp-banco .jp-checks li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: .96rem; align-items: baseline; }
#jp-banco .jp-checks li span { color: var(--jp-ciano); font-weight: 500; }
#jp-banco .jp-recebe-nota {
  font-size: .9rem; color: var(--jp-suave); border-left: 3px solid var(--jp-ciano);
  padding-left: 14px; max-width: 72ch;
}

/* ============================== caixa da BNCC ========================== */
#jp-banco .jp-bncc-caixa { border: 1px solid var(--jp-linha); border-radius: var(--jp-r); margin: 36px 0 12px; }
#jp-banco .jp-bncc-caixa summary {
  padding: 16px 20px; cursor: pointer; font-weight: 500; color: var(--jp-navy); list-style: none;
}
#jp-banco .jp-bncc-caixa summary::-webkit-details-marker { display: none; }
#jp-banco .jp-bncc-caixa summary::after { content: " +"; color: var(--jp-ambar); }
#jp-banco .jp-bncc-caixa[open] summary::after { content: " \2212"; }
#jp-banco .jp-bncc-caixa-corpo { padding: 0 20px 20px; border-top: 1px solid var(--jp-linha); }
