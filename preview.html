<!doctype html>
<html lang="pt-BR">
<head>

<title>Banco de Atividades — preview local</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
<script>
/* Preview local: a folha de estilo também precisa de cache-busting, senão você

  .aviso-preview { background:#fff5e3; color:#8a5800; font-size:.78rem; text-align:center; padding:7px; }
  main { padding: 44px 0 0; }
  @media print { .fake, .fake-rodape, .aviso-preview { display:none } main { padding:0 } }
</style>
</head>
